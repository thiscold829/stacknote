<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>진도관리 — StackNote</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD@100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"/>
<style>
:root{--ink:#000;--ink-soft:#1e293b;--ink-mute:#94a3b8;}
html,body{height:100%;}
body{font-family:'Pretendard',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;background:radial-gradient(1000px 800px at 5% 5%,#ffffff,transparent 65%),radial-gradient(1200px 900px at 95% 95%,#cbd5e1,transparent 65%),linear-gradient(180deg,#f1f5f9 0%,#e2e8f0 100%);background-attachment:fixed;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.05  0 0 0 0 0.05  0 0 0 0 0.07  0 0 0 0 0.012 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:multiply;opacity:.35;}
main,nav,footer{position:relative;z-index:1;}
.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;display:inline-block;}
.nav{background:rgba(255,255,255,0.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-bottom:1px solid rgba(255,255,255,1);}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:-0.05em;font-size:20px;color:var(--ink);}
.section-title{font-family:'Space Grotesk',sans-serif;font-weight:800;letter-spacing:-0.03em;color:var(--ink);font-size:19px;text-transform:uppercase;}
.section-ko{font-size:13px;font-weight:700;color:var(--ink-mute);margin-left:10px;}
.island{background:linear-gradient(180deg,rgba(255,255,255,0.7) 0%,rgba(248,250,252,0.4) 100%);border:1px solid rgba(255,255,255,0.8);border-top:1px solid rgba(255,255,255,1);border-radius:24px;box-shadow:0 20px 50px -20px rgba(15,23,42,0.12);backdrop-filter:blur(48px) saturate(180%);-webkit-backdrop-filter:blur(48px) saturate(180%);padding:28px 32px;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-family:'Space Grotesk',sans-serif;font-size:9px;letter-spacing:.25em;font-weight:700;color:var(--ink-mute);text-transform:uppercase;padding:0 10px 14px;text-align:left;border-bottom:1px solid rgba(15,23,42,0.07);}
.tbl td{padding:10px 10px;border-bottom:1px solid rgba(15,23,42,0.04);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr[draggable]:hover td{background:rgba(255,255,255,0.5);}
.tbl tr.dragging{opacity:0.35;}
.tbl tr.drag-over td{background:rgba(99,102,241,0.06);}
.inp{width:100%;background:rgba(255,255,255,0.8);border:1px solid rgba(15,23,42,0.1);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--ink);outline:none;transition:all .2s;}
.inp:focus{border-color:rgba(99,102,241,0.5);box-shadow:0 0 0 3px rgba(99,102,241,0.1);}
select.inp{cursor:pointer;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.badge-ok{background:#ecfdf5;color:#065f46;}
.badge-warn{background:#fffbeb;color:#92400e;}
.badge-crit{background:#fef2f2;color:#991b1b;}
.badge-done{background:#f1f5f9;color:#475569;}
.badge-idle{background:#f8fafc;color:#94a3b8;}
.mini-bar{height:3px;border-radius:99px;background:rgba(15,23,42,0.08);overflow:hidden;width:80px;}
.mini-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#0b1220,#334155);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;border:none;outline:none;}
.btn-primary{background:#0b1220;color:#fff;box-shadow:0 4px 12px rgba(15,23,42,0.2);}
.btn-primary:hover{background:#1e293b;transform:translateY(-1px);}
.btn-ghost{background:rgba(255,255,255,0.7);color:var(--ink-soft);border:1px solid rgba(15,23,42,0.1);}
.btn-ghost:hover{background:#fff;}
.btn-danger{background:rgba(254,242,242,0.9);color:#991b1b;border:1px solid rgba(252,165,165,0.4);}
.btn-danger:hover{background:#fef2f2;}
.btn-sm{padding:5px 12px;font-size:11px;}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#0b1220;color:#fff;padding:12px 24px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.02em;opacity:0;transition:all .4s cubic-bezier(0.16,1,0.3,1);z-index:999;box-shadow:0 20px 40px rgba(15,23,42,0.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,0.15);backdrop-filter:blur(12px);z-index:900;display:none;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{width:520px;background:linear-gradient(160deg,rgba(255,255,255,0.9) 0%,rgba(248,250,252,0.85) 100%);border:1px solid rgba(255,255,255,1);border-radius:28px;padding:36px 40px;box-shadow:0 40px 80px -20px rgba(15,23,42,0.25),inset 0 1px 0 rgba(255,255,255,1);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:800;letter-spacing:-0.03em;margin-bottom:24px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:10px;font-weight:700;color:var(--ink-mute);letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px;}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.sync-dot.ok{background:#34d399;}
.sync-dot.loading{background:#fbbf24;animation:pulse 1s infinite;}
.sync-dot.err{background:#f87171;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
footer{font-size:11px;color:var(--ink-mute);padding:40px 0 24px;text-align:center;font-weight:700;letter-spacing:.15em;text-transform:uppercase;opacity:.6;}
</style>
</head>
<body>
<nav class="fixed top-0 left-0 right-0 z-50 nav">
  <div class="flex justify-between items-center px-10 py-3 w-full max-w-[1920px] mx-auto">
    <div class="flex items-center gap-6">
      <a href="StackNote.html" class="flex items-center gap-3">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="3" y="16.5" width="18" height="3" rx="1" fill="#000"/><rect x="3" y="10.5" width="14" height="3" rx="1" fill="#64748b"/><rect x="3" y="4.5" width="10" height="3" rx="1" fill="#cbd5e1"/></svg>
        <span class="brand">Stack<span style="color:var(--ink-mute);font-weight:600;">Note</span></span>
      </a>
      <span class="text-[11px] font-black text-slate-400 tracking-[.2em] uppercase">/ 진도관리</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="flex items-center gap-2 text-[11px] font-bold text-slate-400">
        <span class="sync-dot loading" id="sync-dot"></span>
        <span id="sync-text">불러오는 중...</span>
      </span>
      <button class="btn btn-ghost btn-sm" onclick="loadData()">
        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL' 0,'wght' 500;">refresh</span>새로고침
      </button>
      <button class="btn btn-primary" onclick="saveAll()">
        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL' 1,'wght' 600;">cloud_upload</span>저장
      </button>
    </div>
  </div>
</nav>
<main class="pt-[100px] px-10 pb-10 w-full max-w-[1920px] mx-auto flex-1">
  <section class="mt-4">
    <div class="flex items-baseline justify-between mb-6 px-1">
      <div>
        <h2 class="section-title" style="display:inline;">사업 진도관리</h2>
        <span class="section-ko">Project Progress Manager</span>
      </div>
      <button class="btn btn-ghost" onclick="openAddModal()">
        <span class="material-symbols-outlined text-[15px]" style="font-variation-settings:'FILL' 0,'wght' 500;">add_circle</span>사업 추가
      </button>
    </div>
    <div class="island">
      <table class="tbl">
        <thead>
          <tr>
            <th style="width:36px;"></th>
            <th style="width:50px;">순서</th>
            <th style="width:90px;">약어 ID</th>
            <th>풀네임</th>
            <th style="width:110px;">팀</th>
            <th style="width:110px;">진행률</th>
            <th style="width:90px;">상태</th>
            <th>구글시트 URL</th>
            <th style="width:90px;"></th>
          </tr>
        </thead>
        <tbody id="proj-body">
          <tr><td colspan="9" style="text-align:center;padding:40px;opacity:0.4;font-size:13px;font-weight:700;letter-spacing:.1em;">LOADING ···</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
<footer>© 2026 StackNote · CHAN LEE · 진도관리 모듈</footer>

<div class="modal-bg" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">사업 추가</div>
    <input type="hidden" id="edit-idx" value="-1"/>
    <div class="field"><label>약어 (ID)</label><input class="inp" id="e-id" placeholder="예: HBM"/></div>
    <div class="field"><label>풀네임</label><input class="inp" id="e-full" placeholder="예: HBM 고도화 사업"/></div>
    <div class="field"><label>팀</label>
      <select class="inp" id="e-team">
        <option>식품AX팀</option><option>환경AX팀</option><option>PE실</option><option>PM실</option><option>PS실</option>
      </select>
    </div>
    <div class="field"><label>진행률 (%)</label><input class="inp" id="e-pct" type="number" min="0" max="100" placeholder="0~100"/></div>
    <div class="field"><label>상태</label>
      <select class="inp" id="e-status">
        <option value="ok">정상 (ok)</option><option value="warn">주의 (warn)</option><option value="crit">긴급 (crit)</option><option value="done">완료 (done)</option><option value="idle">미시작 (idle)</option>
      </select>
    </div>
    <div class="field"><label>구글시트 URL (팝업에 표시될 시트)</label><input class="inp" id="e-url" placeholder="https://docs.google.com/spreadsheets/d/..."/></div>
    <div class="flex gap-3 mt-6 justify-end">
      <button class="btn btn-ghost" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="saveModal()">
        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL' 1,'wght' 600;">check</span>확인
      </button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbzl-Rk6Um-qsYLJjPX6BgJf3Ka2j7uyFALWpFykRafSM8KjHmloPtc6Bjw7C7jkCfBEhA/exec';
let projects=[];
let dragSrc=null;
const statusLabels={ok:'정상',warn:'주의',crit:'긴급',done:'완료',idle:'미시작'};
const statusClass={ok:'badge-ok',warn:'badge-warn',crit:'badge-crit',done:'badge-done',idle:'badge-idle'};

async function loadData(){
  setSyncState('loading','불러오는 중...');
  try{
    const res=await fetch(API+'?action=read');
    const data=await res.json();
    projects=(data.projects||[]).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
    renderTable();
    setSyncState('ok','동기화 완료');
  }catch(e){setSyncState('err','연결 실패');showToast('연결 실패');}
}

function renderTable(){
  const body=document.getElementById('proj-body');
  if(!projects.length){body.innerHTML='<tr><td colspan="9" style="text-align:center;padding:40px;opacity:0.4;font-size:13px;font-weight:700;">사업이 없습니다.</td></tr>';return;}
  body.innerHTML=projects.map((p,i)=>{
    const pct=Number(p.pct)||0;
    const shortUrl=p.sheet_url?'...'+p.sheet_url.slice(-28):'—';
    return `<tr draggable="true" data-idx="${i}" ondragstart="dragStart(event,${i})" ondragover="dragOver(event,${i})" ondrop="dragDrop(event,${i})" ondragend="dragEnd()">
      <td style="cursor:grab;color:#cbd5e1;text-align:center;"><span class="material-symbols-outlined" style="font-size:18px;font-variation-settings:'wght' 300;">drag_indicator</span></td>
      <td style="font-family:'Space Grotesk';font-size:12px;color:var(--ink-mute);font-weight:700;">${i+1}</td>
      <td style="font-family:'Space Grotesk';font-size:14px;font-weight:800;letter-spacing:-0.02em;">${p.id}</td>
      <td style="font-size:13px;font-weight:600;" title="${p.full_name}">${p.full_name}</td>
      <td style="font-size:12px;font-weight:600;color:var(--ink-soft);">${p.team}</td>
      <td><div style="display:flex;align-items:center;gap:8px;"><div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div><span style="font-family:'Space Grotesk';font-size:12px;font-weight:700;">${pct}%</span></div></td>
      <td><span class="badge ${statusClass[p.status]||'badge-idle'}">${statusLabels[p.status]||p.status}</span></td>
      <td style="font-size:11px;color:var(--ink-mute);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${p.sheet_url||''}">${shortUrl}</td>
      <td><div style="display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" onclick="openEditModal(${i})"><span class="material-symbols-outlined" style="font-size:13px;font-variation-settings:'FILL' 0,'wght' 400;">edit</span></button>
        <button class="btn btn-danger btn-sm" onclick="deleteRow(${i})"><span class="material-symbols-outlined" style="font-size:13px;font-variation-settings:'FILL' 0,'wght' 400;">delete</span></button>
      </div></td>
    </tr>`;
  }).join('');
}

function dragStart(e,i){dragSrc=i;e.currentTarget.classList.add('dragging');}
function dragOver(e,i){e.preventDefault();document.querySelectorAll('#proj-body tr').forEach(r=>r.classList.remove('drag-over'));if(i!==dragSrc)e.currentTarget.classList.add('drag-over');}
function dragDrop(e,i){e.preventDefault();if(dragSrc===null||dragSrc===i)return;const m=projects.splice(dragSrc,1)[0];projects.splice(i,0,m);renderTable();}
function dragEnd(){document.querySelectorAll('#proj-body tr').forEach(r=>{r.classList.remove('dragging','drag-over');});dragSrc=null;}

function openAddModal(){
  document.getElementById('modal-title').textContent='사업 추가';
  document.getElementById('edit-idx').value='-1';
  ['e-id','e-full','e-url'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('e-pct').value='0';
  document.getElementById('e-team').value='식품AX팀';
  document.getElementById('e-status').value='idle';
  document.getElementById('edit-modal').classList.add('open');
}
function openEditModal(i){
  const p=projects[i];
  document.getElementById('modal-title').textContent='사업 수정';
  document.getElementById('edit-idx').value=i;
  document.getElementById('e-id').value=p.id||'';
  document.getElementById('e-full').value=p.full_name||'';
  document.getElementById('e-team').value=p.team||'식품AX팀';
  document.getElementById('e-pct').value=p.pct||0;
  document.getElementById('e-status').value=p.status||'idle';
  document.getElementById('e-url').value=p.sheet_url||'';
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal(){document.getElementById('edit-modal').classList.remove('open');}
function saveModal(){
  const idx=Number(document.getElementById('edit-idx').value);
  const obj={id:document.getElementById('e-id').value.trim(),full_name:document.getElementById('e-full').value.trim(),team:document.getElementById('e-team').value,pct:Number(document.getElementById('e-pct').value)||0,status:document.getElementById('e-status').value,sheet_url:document.getElementById('e-url').value.trim(),order:idx===-1?projects.length+1:projects[idx].order};
  if(!obj.id||!obj.full_name){showToast('약어와 풀네임은 필수');return;}
  if(idx===-1)projects.push(obj);else projects[idx]={...projects[idx],...obj};
  renderTable();closeModal();showToast(idx===-1?'추가됐습니다':'수정됐습니다');
}
function deleteRow(i){
  if(!confirm('"'+projects[i].id+'" 삭제하시겠습니까?'))return;
  projects.splice(i,1);renderTable();showToast('삭제됐습니다');
}
async function saveAll(){
  setSyncState('loading','저장 중...');
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({action:'write',projects:projects.map((p,i)=>({...p,order:i+1}))})});
    setSyncState('ok','저장 완료');showToast('구글시트에 저장됐습니다');
  }catch(e){setSyncState('err','저장 실패');showToast('저장 실패');}
}
function setSyncState(s,t){document.getElementById('sync-dot').className='sync-dot '+s;document.getElementById('sync-text').textContent=t;}
let tt;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2800);}
loadData();
</script>
</body>
</html>
